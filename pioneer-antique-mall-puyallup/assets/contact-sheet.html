<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Contact sheet</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;padding:24px;background:#EFE7D8;color:#18211C;font:15px/1.4 -apple-system,Helvetica,Arial,sans-serif}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 20px;color:#66635A}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
figure{margin:0;background:#F6EFE2;border:1px solid #DCD2BF;padding:10px;border-radius:10px}
figure img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:6px;background:#E5DBC7}
figcaption{margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
figcaption b{display:inline-block;min-width:28px;color:#B8241F;font-size:15px}
.dim{color:#66635A;font-size:11px}
</style></head><body>
<h1>Contact sheet</h1>
<p>11 images in images/ — say the number + the slot (“7 for hero, 3 and 12 for gallery”).</p><div class="grid">
<figure><img src="../images/buy.jpg" alt="buy.jpg" loading="lazy"><figcaption><b>1</b> buy.jpg <span class="dim">1800×1603</span></figcaption></figure>
<figure><img src="../images/gallery-1.jpg" alt="gallery-1.jpg" loading="lazy"><figcaption><b>2</b> gallery-1.jpg <span class="dim">1800×2400</span></figcaption></figure>
<figure><img src="../images/gallery-2.jpg" alt="gallery-2.jpg" loading="lazy"><figcaption><b>3</b> gallery-2.jpg <span class="dim">1800×2400</span></figcaption></figure>
<figure><img src="../images/gallery-3.jpg" alt="gallery-3.jpg" loading="lazy"><figcaption><b>4</b> gallery-3.jpg <span class="dim">1800×2400</span></figcaption></figure>
<figure><img src="../images/hero-stack-1.jpg" alt="hero-stack-1.jpg" loading="lazy"><figcaption><b>5</b> hero-stack-1.jpg <span class="dim">1800×1087</span></figcaption></figure>
<figure><img src="../images/hero-stack-2.jpg" alt="hero-stack-2.jpg" loading="lazy"><figcaption><b>6</b> hero-stack-2.jpg <span class="dim">1350×2400</span></figcaption></figure>
<figure><img src="../images/hero-stack-3.jpg" alt="hero-stack-3.jpg" loading="lazy"><figcaption><b>7</b> hero-stack-3.jpg <span class="dim">1800×1012</span></figcaption></figure>
<figure><img src="../images/inside-1.jpg" alt="inside-1.jpg" loading="lazy"><figcaption><b>8</b> inside-1.jpg <span class="dim">1800×1012</span></figcaption></figure>
<figure><img src="../images/inside-2.jpg" alt="inside-2.jpg" loading="lazy"><figcaption><b>9</b> inside-2.jpg <span class="dim">1800×1012</span></figcaption></figure>
<figure><img src="../images/inside-3.jpg" alt="inside-3.jpg" loading="lazy"><figcaption><b>10</b> inside-3.jpg <span class="dim">1800×1012</span></figcaption></figure>
<figure><img src="../images/wall.jpg" alt="wall.jpg" loading="lazy"><figcaption><b>11</b> wall.jpg <span class="dim">1920×1440</span></figcaption></figure>
</div></body></html>
