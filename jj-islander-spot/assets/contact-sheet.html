<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Contact sheet</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;padding:24px;background:#EFE7D8;color:#18211C;font:15px/1.4 -apple-system,Helvetica,Arial,sans-serif}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 20px;color:#66635A}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
figure{margin:0;background:#F6EFE2;border:1px solid #DCD2BF;padding:10px;border-radius:10px}
figure img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:6px;background:#E5DBC7}
figcaption{margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
figcaption b{display:inline-block;min-width:28px;color:#B8241F;font-size:15px}
.dim{color:#66635A;font-size:11px}
</style></head><body>
<h1>Contact sheet</h1>
<p>3 images in images/ — say the number + the slot (“7 for hero, 3 and 12 for gallery”).</p><div class="grid">
<figure><img src="../images/counter.jpg" alt="counter.jpg" loading="lazy"><figcaption><b>1</b> counter.jpg <span class="dim">1025×769</span></figcaption></figure>
<figure><img src="../images/storefront.jpg" alt="storefront.jpg" loading="lazy"><figcaption><b>2</b> storefront.jpg <span class="dim">1025×769</span></figcaption></figure>
<figure><img src="../images/turkey-tails.jpg" alt="turkey-tails.jpg" loading="lazy"><figcaption><b>3</b> turkey-tails.jpg <span class="dim">1025×1367</span></figcaption></figure>
</div></body></html>
