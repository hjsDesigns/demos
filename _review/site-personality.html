<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fourteen distinct places · HJS Designs website review</title><style>:root{--paper:#f7f2e9;--ink:#233a30;--line:#cad2c8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}small{letter-spacing:.14em;text-transform:uppercase}h1{font:38px/1.1 Georgia,serif;margin:10px 0}p{max-width:650px}label{display:block;margin:20px 0 6px;font-weight:600}select{width:100%;max-width:540px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:9px;font:inherit}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}button,a{font:inherit;color:inherit}button,.external{padding:10px 15px;border:1px solid var(--ink);border-radius:30px;background:transparent;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:var(--ink);color:var(--paper)}.phone{width:406px;max-width:100%;margin:24px auto;background:var(--ink);padding:8px;border-radius:26px}iframe{width:390px;max-width:100%;height:760px;display:block;border:0;background:white;border-radius:18px}#approval{font-size:13px}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #a36439;outline-offset:3px}@media(max-width:460px){main{padding:20px 12px}h1{font-size:32px}}</style></head><body><main><small>HJS Designs · Website review</small><h1>All 14, ready to review.</h1><p>Clear business names, more useful detail, and a distinct atmosphere from the first screen to the footer. Review each revised website below.</p><label for="sites">Choose a website</label><select id="sites"></select><p id="approval"></p><div class="controls"><button id="previous-site" aria-label="Previous website">← Previous</button><span id="position" style="align-self:center"></span><button id="next-site" aria-label="Next website">Next →</button></div><div class="controls"><button id="reviews" aria-pressed="true">Review section</button><button id="hero" aria-pressed="false">Whole website</button><a class="external" id="public" target="_blank" rel="noopener">Open public website ↗</a></div><div class="phone"><iframe id="preview" title="Selected website mobile preview"></iframe></div></main><script>const sites=[{"name": "Outlaw Artistry", "slug": "outlaw-artistry", "variant": "versions/untamed-and-at-ease.html"}, {"name": "AvaBellas Brow & Skincare Studio", "slug": "avabellas-brow-and-skincare-studio", "variant": "versions/rose-room.html"}, {"name": "Cedar River Espresso", "slug": "cedar-river-espresso-renton", "variant": "versions/the-morning-curve.html"}, {"name": "El Caporal", "slug": "el-caporal-maple-valley", "variant": "versions/hero-an-open-door.html"}, {"name": "Euphoriq Skin & Beauty", "slug": "euphoriq-skin-and-beauty-sumner", "variant": "versions/hero-the-living-wall.html"}, {"name": "Europa Restaurant", "slug": "europa-black-diamond", "variant": null}, {"name": "GLO Skin Clinic and Spa", "slug": "glo-skin-clinic-maple-valley", "variant": "versions/hero-entirely-yours-studio.html"}, {"name": "Homestead Brew", "slug": "homestead-brew-sumner", "variant": "versions/hero-cabin-postcard-whole-cabin.html"}, {"name": "Kelly Latte\u2019s", "slug": "kelly-lattes-kent", "variant": "versions/hero-extra-good-cream-and-coffee.html"}, {"name": "Roundup Restaurant & Lounge", "slug": "roundup-bar-grill-graham", "variant": "versions/hero-where-the-night-begins.html"}, {"name": "Salon 410", "slug": "salon-410-buckley", "variant": "versions/hero-color-studio-stone.html"}, {"name": "Village Coffee", "slug": "village-coffee-maple-valley", "variant": "versions/hero-magnolia-morning.html"}, {"name": "Vintage Vino & Espresso", "slug": "vintage-vino-and-espresso-maple-valley", "variant": null}, {"name": "Zola\u2019s Cafe", "slug": "zolas-cafe-auburn", "variant": "versions/hero-stay-a-little-longer.html"}];const selector=document.getElementById('sites'),preview=document.getElementById('preview');let section=new URLSearchParams(location.search).get('section')==='reviews'?'reviews':'hero';for(const s of sites){const o=new Option(s.name,s.slug);selector.add(o)}selector.value=new URLSearchParams(location.search).get('site')||'outlaw-artistry';function show(){const s=sites.find(x=>x.slug===selector.value)||sites[0];const i=sites.indexOf(s);document.getElementById('position').textContent=(i+1)+' of '+sites.length;document.getElementById('previous-site').disabled=i===0;document.getElementById('next-site').disabled=i===sites.length-1;preview.src='../'+s.slug+'/?v=personality-20261011#'+section;document.getElementById('public').href='https://hjsdesigns.github.io/demos/'+s.slug+'/?v=personality-20261011#'+section;document.getElementById('approval').textContent=['outlaw-artistry','avabellas-brow-and-skincare-studio'].includes(s.slug)?'New website · full-page revision awaiting your review':'Previously approved website · new full-page revision awaiting your review';for(const id of ['reviews','hero'])document.getElementById(id).setAttribute('aria-pressed',String(id===section));history.replaceState(null,'','?site='+s.slug)}selector.onchange=show;document.getElementById('previous-site').onclick=()=>{selector.selectedIndex=Math.max(0,selector.selectedIndex-1);section='hero';show()};document.getElementById('next-site').onclick=()=>{selector.selectedIndex=Math.min(sites.length-1,selector.selectedIndex+1);section='hero';show()};for(const id of ['reviews','hero'])document.getElementById(id).onclick=()=>{section=id;show()};show();</script></body></html>
