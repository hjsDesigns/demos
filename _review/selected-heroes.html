<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Your chosen heroes · HJS Designs</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#111714;--panel:#19221d;--ink:#f1f0e6;--muted:#a3b1a6;--line:#34433a;--accent:#dbefb0;--display:'Bricolage Grotesque',Georgia,serif;--body:'DM Sans',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:5px}a{color:inherit}header{padding:38px 5vw 30px;border-bottom:1px solid var(--line);background:radial-gradient(ellipse at 80% 0,#2b3e2c,transparent 65%)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:700;color:var(--accent);margin:0 0 17px}.intro{display:flex;justify-content:space-between;align-items:end;gap:25px}h1{font:650 clamp(38px,6vw,80px)/.98 var(--display);letter-spacing:-.045em;margin:0}.intro p{max-width:440px;color:var(--muted);margin:0 0 2px}#status{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:30px;font-size:13px;color:var(--muted)}#status b{color:var(--accent);font-size:17px}.progress{height:4px;background:var(--line);width:120px;overflow:hidden;border-radius:3px}.progress span{display:block;height:100%;background:var(--accent);transition:width .5s}nav{position:sticky;top:0;z-index:3;display:flex;overflow:auto;gap:7px;padding:12px 5vw;background:#111714f2;backdrop-filter:blur(15px);border-bottom:1px solid var(--line);scrollbar-width:thin}nav a{text-decoration:none;white-space:nowrap;padding:8px 13px;border:1px solid var(--line);border-radius:99px;font-size:12px}nav a:hover{background:var(--panel);border-color:var(--accent)}main{padding:4px 5vw 90px;max-width:1720px;margin:auto}.site{padding:44px 0;border-bottom:1px solid var(--line);scroll-margin-top:75px}.site-head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:22px}.site-head h2{font:650 clamp(26px,3vw,42px)/1.06 var(--display);letter-spacing:-.025em;margin:0 0 7px}.site-head p{margin:0;color:var(--muted);font-size:13px}.site-num{display:inline-block;margin-bottom:12px;color:var(--accent);font:500 12px var(--body);letter-spacing:.12em}.state{padding:5px 10px;border:1px solid var(--line);border-radius:20px;font-size:11px;color:var(--muted);white-space:nowrap}.state.ready{background:var(--accent);color:var(--bg);border-color:var(--accent)}.variants{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.variant{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;color:var(--ink)}button.variant:hover{border-color:var(--accent)}.thumb{height:clamp(235px,28vw,420px);position:relative;overflow:hidden;background:#26372b;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:contain;object-position:center;transition:transform .5s}button.variant:hover .thumb img{transform:scale(1.025)}.number{position:absolute;left:12px;top:12px;z-index:1;background:#111714e8;padding:5px 9px;border:1px solid #ffffff25;border-radius:6px;font-size:11px}.open-mark{position:absolute;right:13px;bottom:13px;background:var(--accent);color:var(--bg);border-radius:50%;height:38px;width:38px;display:grid;place-items:center;font-size:23px}.card-copy{padding:20px;flex:1}.card-copy h3{font:650 24px/1.08 var(--display);letter-spacing:-.02em;margin:0 0 8px}.card-copy p{font-size:13px;line-height:1.6;color:var(--muted);margin:0}.pending{opacity:.75;min-height:245px;background:linear-gradient(135deg,var(--panel),#142019);padding:24px;justify-content:space-between}.pending .ghost-num{font:500 65px/1 var(--display);color:#344a39}.pending strong{display:block;font:500 19px var(--display);margin-bottom:5px}.pending p{font-size:13px;margin:0;color:var(--muted)}.fallback{font:500 25px var(--display);padding:25px;text-align:center;color:var(--accent)}.current{display:inline-block;margin-top:16px;border:0;background:none;color:var(--muted);padding:0;font-size:12px;text-decoration:underline;text-underline-offset:4px}.favorite{color:var(--accent)!important;font-size:11px!important;margin:0 0 10px!important}.site-head .feedback-note{color:var(--accent);margin-top:7px}.note{margin:30px 0 0;color:var(--muted);font-size:12px}
dialog{padding:0;border:1px solid var(--line);border-radius:14px;background:#0e1410;color:var(--ink);width:calc(100vw - 24px);max-width:1550px;height:calc(100dvh - 24px);max-height:none;overflow:hidden}dialog::backdrop{background:#070c09df;backdrop-filter:blur(10px)}.viewer{height:100%;display:flex;flex-direction:column}.toolbar{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.viewer-name strong{display:block;font:650 20px/1.15 var(--display)}.viewer-name small{font-size:11px;color:var(--muted)}.controls{display:flex;gap:6px;align-items:center}.controls button,.controls a{border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);padding:8px 11px;font-size:12px;text-decoration:none}.controls button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}.controls .close{font-size:20px;padding:2px 10px}.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;overflow:hidden;background:radial-gradient(ellipse,#25362b,#0c120e 70%);padding:14px}.frame-wrap{width:390px;height:844px;flex:none;transform:scale(var(--scale,1));transform-origin:center;border-radius:10px;overflow:hidden;background:#f0e9dd;box-shadow:0 15px 70px #0008}iframe{border:0;width:100%;height:100%;display:block}.viewer-foot{padding:11px 18px;border-top:1px solid var(--line);display:flex;gap:15px;align-items:center;justify-content:space-between}.viewer-foot p{margin:0;color:var(--muted);font-size:12px;max-width:850px}.arrows{display:flex;gap:7px}.arrows button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;width:40px;height:34px;font-size:20px}@media(max-width:720px){header{padding-top:28px}.intro{display:block}.intro p{margin-top:20px;max-width:440px}.variants{grid-template-columns:1fr}.thumb{height:420px}.pending{min-height:140px}.pending .ghost-num{font-size:42px}.site-head{align-items:start}.site{padding:32px 0}.toolbar{padding:10px;gap:10px}.viewer-name strong{font-size:17px}.controls{gap:4px}.controls button,.controls a{padding:7px}.viewer-foot p{font-size:11px}.state{font-size:10px}.thumb img{object-fit:contain;background:#111714}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.remaining-choices{padding:25px 5vw 28px;background:var(--panel);border-bottom:1px solid var(--line)}.remaining-head{display:flex;align-items:baseline;gap:22px;justify-content:space-between;margin-bottom:17px}.remaining-head h2{font:650 27px/1.12 var(--display);letter-spacing:-.025em;margin:0}.remaining-head p{font-size:13px;color:var(--muted);margin:0}.remaining-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.remaining-link{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;padding:15px 16px;background:var(--bg);border:1px solid var(--line);border-radius:9px;text-decoration:none;min-width:0}.remaining-link strong{font-size:16px;line-height:1.2;color:var(--accent)}.remaining-link small{grid-column:1/-1;font-size:11px;line-height:1.4;color:var(--muted)}.remaining-link>span{font-size:20px;line-height:1;color:var(--accent)}.remaining-link:hover{border-color:var(--accent);background:#243127}.new-sets{padding:19px 5vw 21px;background:var(--panel);border-bottom:1px solid var(--line)}.new-sets-label{font-size:13px;font-weight:700;color:var(--accent);margin:0 0 12px}.new-set-links{display:flex;gap:9px;flex-wrap:wrap}.new-set-links a{display:block;flex:1;min-width:0;padding:9px 13px;border:1px solid var(--line);border-radius:7px;font-size:12px;text-decoration:none;min-height:43px}.new-set-links a:hover{border-color:var(--accent)}.new-set-links small{display:block;margin-top:4px;color:var(--muted);font-size:11px}.new-sets>a{display:inline-block;margin-top:15px;color:var(--accent);font-size:13px;text-underline-offset:4px}@media(max-width:720px){.remaining-choices{padding-top:21px;padding-bottom:22px}.remaining-head{display:block;margin-bottom:15px}.remaining-head h2{font-size:25px}.remaining-head p{margin-top:8px}.remaining-links{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.remaining-link{padding:13px 12px}.remaining-link strong{font-size:15px}.remaining-link:last-child:nth-child(odd){grid-column:1/-1}.remaining-link:last-child small{grid-column:1;grid-row:2}.new-set-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.new-set-links a{display:block;min-width:0}.new-set-links small{display:block;margin-top:3px}.new-set-links a:last-child{grid-column:1/-1}}

header{padding:32px 5vw}h1{font-size:clamp(34px,5vw,68px)}.intro p{max-width:420px}.back{display:inline-block;margin-top:23px;font-size:13px;color:var(--accent);text-underline-offset:4px}.selection-section{padding:35px 0}.selection-section h2{font:650 28px/1.15 var(--display);margin:0 0 12px}.selection-section>p{color:var(--muted);font-size:14px;margin:0 0 24px}.selections-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.thumb{height:clamp(340px,42vw,570px)}.card-copy h3{font-size:25px}.choice-business{color:var(--accent)!important;font-weight:700;margin-bottom:10px!important}.choice-state{font-size:11px;display:inline-block;padding:4px 8px;background:var(--accent);color:var(--bg);border-radius:4px;margin-top:12px}.conditional{border-top:1px solid var(--line)}.conditional .selections-grid{max-width:440px;grid-template-columns:1fr}.conditional .thumb{height:420px}.conditional .choice-state{background:#e9cc8a}.open-items{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;border-top:1px solid var(--line);padding-top:28px}.open-items p{font-size:13px;color:var(--muted)}.open-items strong{font-weight:600;color:var(--ink);display:block;margin-bottom:7px}@media(max-width:800px){.selections-grid{grid-template-columns:1fr}.thumb{height:570px}.open-items{grid-template-columns:1fr;gap:4px}.conditional .selections-grid{max-width:none}}
</style></head><body><header><p class="eyebrow">HJS Designs · Your choices</p><div class="intro"><h1>Your chosen<br>hero designs.</h1><p id="selection-overview">Your saved designs, refinements and remaining choices.</p></div><a class="back" href="hero-variants.html?v=20261009-picks">See all nine sites and every option ↗</a></header><section class="remaining-choices" id="remaining-section" aria-labelledby="remaining-title" hidden><div class="remaining-head"><h2 id="remaining-title">Still to choose</h2><p id="remaining-summary"></p></div><div class="remaining-links" id="remaining-links"></div></section><main><section class="selection-section" id="selected-section"><h2 id="selected-title">Chosen heroes — ready to view</h2><p id="selected-summary">Loading your saved choices…</p><div class="selections-grid" id="selected"></div></section><section class="selection-section conditional" id="conditional-section" hidden><h2 id="conditional-title">Refinement to review</h2><p id="conditional-summary"></p><div class="selections-grid" id="conditional"></div></section><p class="note" id="batch-note"></p></main><dialog id="preview" aria-labelledby="preview-name"><div class="viewer"><div class="toolbar"><div class="viewer-name"><strong id="preview-name"></strong><small id="preview-site"></small></div><div class="controls"><button id="phone" aria-pressed="true">Phone</button><button id="desktop" aria-pressed="false">Desktop</button><button id="replay">↻ Replay</button><a id="full" target="_blank" rel="noopener">Full page ↗</a><button class="close" id="close" aria-label="Close preview">×</button></div></div><div class="stage" id="stage"><div class="frame-wrap" id="frame-wrap"><iframe id="frame" title="Hero and full website preview"></iframe></div></div><div class="viewer-foot"><p id="idea"></p><div class="arrows"><button id="prev" aria-label="Previous variant">‹</button><button id="next" aria-label="Next variant">›</button></div></div></div></dialog>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let records=[],current=0,mode='phone',lastFocus,fingerprint='',initialAnchorPending=true;
function card(v,i){return `<button class="variant" data-choice="${i}" aria-label="Open ${esc(v.business)} option ${v.original_number}"><div class="thumb"><span class="number">Option ${v.original_number}</span><img src="${esc(v.thumbnail)}" alt="${esc(v.business)} — ${esc(v.name)}" loading="eager"><span class="open-mark" aria-hidden="true">↗</span></div><div class="card-copy"><p class="choice-business">${esc(v.business)}</p><h3>${esc(v.name)}</h3><p>${esc(v.note)}</p><span class="choice-state">${esc(v.status)}</span></div></button>`}
function summary(items){return items.map(v=>v.business+' · Option '+(v.original_number??v.number)).join(' / ')}
async function landInitialAnchor(){if(!initialAnchorPending)return;initialAnchorPending=false;const hash=location.hash;if(!hash)return;let id;try{id=decodeURIComponent(hash.slice(1))}catch{return}await document.fonts.ready;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));if(location.hash===hash)document.getElementById(id)?.scrollIntoView({block:'start',behavior:'instant'})}
async function refresh(){try{const data=await fetch('selections.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json());const f=JSON.stringify(data);if(f===fingerprint)return;fingerprint=f;const selected=data.selected||[],conditional=data.conditional||[],unresolved=data.unresolved||[];records=[...selected,...conditional];$('selected').innerHTML=selected.map(card).join('');$('selected-title').textContent='Chosen heroes — '+selected.length+' design'+(selected.length===1?'':'s');$('selected-summary').textContent=summary(selected);$('conditional').innerHTML=conditional.map((v,i)=>card(v,i+selected.length)).join('');$('conditional-section').hidden=!conditional.length;$('conditional-title').textContent=conditional.length===1?'Refinement to review':'Refinements to review';$('conditional-summary').textContent=conditional.map(v=>v.business+' · Option '+(v.original_number??v.number)+' — '+v.note).join(' / ');$('remaining-section').hidden=!unresolved.length;$('remaining-summary').textContent=unresolved.length+' choice'+(unresolved.length===1?'':'s')+' still open. Your other selections are saved below.';$('remaining-links').innerHTML=unresolved.filter(v=>v.slug).map(v=>`<a class="remaining-link" href="hero-variants.html?v=20261009-picks#${esc(v.slug)}"><strong>${esc(v.business)}</strong><span aria-hidden="true">↗</span><small>${esc(v.note)}</small></a>`).join('');$('selection-overview').innerHTML=`<a href="#selected-section">${selected.length} chosen hero design${selected.length===1?'':'s'}</a>`+(conditional.length?`, <a href="#conditional-section">${conditional.length} refinement${conditional.length===1?'':'s'} to review</a>`:'')+(unresolved.length?` and <a href="#remaining-section">${unresolved.length} choice${unresolved.length===1?'':'s'} still open</a>`:'')+'. Open each full page to review the whole website.';$('batch-note').textContent=data.batch_note||'';await landInitialAnchor()}catch(e){$('selected-summary').textContent='The selections could not load. Retrying shortly.'}}
function fit(){const s=$('stage'),w=mode==='phone'?390:1440,h=mode==='phone'?844:1000;$('frame-wrap').style.width=w+'px';$('frame-wrap').style.height=h+'px';$('frame-wrap').style.setProperty('--scale',Math.min(1,(s.clientWidth-28)/w,(s.clientHeight-28)/h))}
function localURL(url){return ['127.0.0.1','localhost'].includes(location.hostname)?url.replace('https://hjsdesigns.github.io/demos/','../'):url}
function show(i){current=(i+records.length)%records.length;const v=records[current];$('preview-name').textContent=v.name;$('preview-site').textContent=v.business+' · Option '+v.original_number+' · '+v.status;$('idea').textContent=v.idea;$('full').href=localURL(v.site_url||v.url);$('frame').src=localURL(v.url)+'?v='+Date.now();if(!$('preview').open){lastFocus=document.activeElement;$('preview').showModal();document.body.style.overflow='hidden'}fit()}
document.querySelector('main').addEventListener('click',e=>{const b=e.target.closest('[data-choice]');if(b)show(Number(b.dataset.choice))});$('close').onclick=()=>$('preview').close();$('preview').addEventListener('close',()=>{$('frame').src='about:blank';document.body.style.overflow='';lastFocus?.focus()});$('replay').onclick=()=>show(current);$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);for(const m of ['phone','desktop'])$(m).onclick=()=>{mode=m;for(const k of ['phone','desktop'])$(k).setAttribute('aria-pressed',String(k===mode));fit()};addEventListener('resize',fit);addEventListener('keydown',e=>{if(!$('preview').open)return;if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});refresh();setInterval(refresh,15000);
</script></body></html>
