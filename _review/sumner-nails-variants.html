<style>
:root{--bg:#F1F0EA;--card:#FFFFFF;--line:#D8D6CC;--ink:#1B1E1A;--mute:#5F665D;--acc:#2A4D6E;--ok:#1F6B3A;--ok-bg:#E1EFE4;--warn:#9A6A16;--warn-bg:#F5EAD3;--bad:#B3372B;--bad-bg:#F4E1DD;--bezel:#15171A;--disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Source Sans 3','Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181A;--card:#1E2226;--line:#2D3338;--ink:#ECEDE8;--mute:#9BA39C;--acc:#8DB4DA;--ok:#5BBE7C;--ok-bg:#1C3324;--warn:#D9A84A;--warn-bg:#36301F;--bad:#E5776A;--bad-bg:#3A221E;--bezel:#0B0C0E}}
:root[data-theme="dark"]{--bg:#15181A;--card:#1E2226;--line:#2D3338;--ink:#ECEDE8;--mute:#9BA39C;--acc:#8DB4DA;--ok:#5BBE7C;--ok-bg:#1C3324;--warn:#D9A84A;--warn-bg:#36301F;--bad:#E5776A;--bad-bg:#3A221E;--bezel:#0B0C0E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding:16px 12px 60px}
main{max-width:1320px;margin:0 auto}h1{font:700 40px/0.95 var(--disp);text-transform:uppercase;margin:4px 0 4px}.lede{color:var(--mute);font-size:15px;margin:0 0 16px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px 18px;justify-items:center}
.phone{margin:0;width:100%;max-width:400px}
figcaption{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px;padding:0 4px}.name{font:600 21px/1 var(--disp);flex:1 1 auto}
.tag{font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:5px}.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.go{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:7px;border:1px solid var(--line);color:var(--acc);font-weight:700;text-decoration:none;font-size:14px}
.frame{background:var(--bezel);border-radius:44px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
iframe{display:block;width:100%;aspect-ratio:390/844;border:0;border-radius:32px;background:#fff}
@media (max-width:420px){body{padding:12px 8px}.frame{padding:8px;border-radius:30px}iframe{border-radius:22px}}
</style><main><h1>Sumner Nails: hero variants</h1><p class="lede">Eight different openers, each inside a phone. Reload a phone to replay its intro; tap Open to hold it. Say the number you want and it goes live.</p><div class="grid"><figure class="phone"><figcaption><span class="name">1. brick-still</span><a class="go" href="https://hjsdesigns.github.io/demos/sumner-nails/hero-brick-still.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/sumner-nails/hero-brick-still.html" title="brick-still" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">brick-still — Sumner Nails hero variant 4 Their own dusk storefront at 1111 Main is held completely still — buff brick, the grey awning, the wall clock, and the window with the &quot;Nails &amp; Spa&quot; LED, the blue-and-red neon OPEN and the &quot;Nails &amp; Waxing&quot; oval burning</p></figure><figure class="phone"><figcaption><span class="name">2. cat-eye</span><a class="go" href="https://hjsdesigns.github.io/demos/sumner-nails/hero-cat-eye.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/sumner-nails/hero-cat-eye.html" title="cat-eye" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">cat-eye — Sumner Nails hero variant 5 Their own plum cat-eye set (`images/finish-catseye-plum.jpg`, shot at this shop) is the whole opener: the photo is held at its exact 975×1300 frame so no nail is ever cropped, and the space around it is the same photograph</p></figure><figure class="phone"><figcaption><span class="name">3. hands-grid</span><a class="go" href="https://hjsdesigns.github.io/demos/sumner-nails/hero-hands-grid.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/sumner-nails/hero-hands-grid.html" title="hands-grid" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">hands-grid — Sumner Nails hero variant 6 Four of their own finished nail sets tile in one at a time as a 2×2 grid — top-left, top-right, bottom-left, bottom-right, 0.27 s apart, each sliding a few percent in from its own corner — and when the fourth lands the </p></figure><figure class="phone"><figcaption><span class="name">4. polish-pour</span><a class="go" href="https://hjsdesigns.github.io/demos/sumner-nails/hero-polish-pour.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/sumner-nails/hero-polish-pour.html" title="polish-pour" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">polish-pour — Sumner Nails hero variant 3 SUMNER NAILS is set huge in Archivo Black (the closest Google face to their own white-keylined window vinyl, SIGN-FONT LAW) on the site&#x27;s cream, and the letters start hollow — outlines only, like empty glass; a stream </p></figure><figure class="phone"><figcaption><span class="name">5. swatch-fan</span><a class="go" href="https://hjsdesigns.github.io/demos/sumner-nails/hero-swatch-fan.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/sumner-nails/hero-swatch-fan.html" title="swatch-fan" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">swatch-fan — Sumner Nails hero variant 1 SUMNER NAILS settles in Archivo Black in the window-vinyl magenta on their cream ground, and then the shop&#x27;s five real finish photos deal out left to right on a swatch ring underneath it — the fan a nail tech spreads on</p></figure><figure class="phone"><figcaption><span class="name">6. vinyl-wipe</span><a class="go" href="https://hjsdesigns.github.io/demos/sumner-nails/hero-vinyl-wipe.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/sumner-nails/hero-vinyl-wipe.html" title="vinyl-wipe" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">vinyl-wipe — Sumner Nails hero variant 2 (polish pass, 2026-09-08) Their own storefront at 1111 Main sits at full exposure from the first frame, and the wordmark is **applied** to it the way the shop&#x27;s own lettering was applied to that glass: one squeegee blad</p></figure></div></main>
