<style>
:root{--bg:#F1F0EA;--card:#FFFFFF;--line:#D8D6CC;--ink:#1B1E1A;--mute:#5F665D;--acc:#2A4D6E;--ok:#1F6B3A;--ok-bg:#E1EFE4;--warn:#9A6A16;--warn-bg:#F5EAD3;--bad:#B3372B;--bad-bg:#F4E1DD;--bezel:#15171A;--disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Source Sans 3','Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181A;--card:#1E2226;--line:#2D3338;--ink:#ECEDE8;--mute:#9BA39C;--acc:#8DB4DA;--ok:#5BBE7C;--ok-bg:#1C3324;--warn:#D9A84A;--warn-bg:#36301F;--bad:#E5776A;--bad-bg:#3A221E;--bezel:#0B0C0E}}
:root[data-theme="dark"]{--bg:#15181A;--card:#1E2226;--line:#2D3338;--ink:#ECEDE8;--mute:#9BA39C;--acc:#8DB4DA;--ok:#5BBE7C;--ok-bg:#1C3324;--warn:#D9A84A;--warn-bg:#36301F;--bad:#E5776A;--bad-bg:#3A221E;--bezel:#0B0C0E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding:16px 12px 60px}
main{max-width:1320px;margin:0 auto}h1{font:700 40px/0.95 var(--disp);text-transform:uppercase;margin:4px 0 4px}.lede{color:var(--mute);font-size:15px;margin:0 0 16px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px 18px;justify-items:center}
.phone{margin:0;width:100%;max-width:400px}
figcaption{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px;padding:0 4px}.name{font:600 21px/1 var(--disp);flex:1 1 auto}
.tag{font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:5px}.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.go{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:7px;border:1px solid var(--line);color:var(--acc);font-weight:700;text-decoration:none;font-size:14px}
.frame{background:var(--bezel);border-radius:44px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.25)}

@media (max-width:420px){body{padding:12px 8px}.frame{padding:8px;border-radius:30px}iframe{border-radius:22px}}
</style><main><h1>Seven to re-approve</h1><p class="lede">The hero changes you asked for at 12:15. Reload a phone to replay. Say the number: approve, change again, or what to fix.</p><div class="grid"><figure class="phone"><figcaption><span class="pname">1. Ink&#x27;d Ink.</span><a class="go small" href="https://hjsdesigns.github.io/demos/inkd-ink-sumner/">Open</a></figcaption><div class="frame"><iframe src="../inkd-ink-sumner/index.html?v=re" title="Ink&#x27;d Ink." loading="lazy"></iframe></div><p class="note">NEW hero: dealt — six of her real pieces fan out like a hand of cards, her logo comes forward, one glitter shine</p></figure><figure class="phone"><figcaption><span class="pname">2. Mulligans Sumner</span><a class="go small" href="https://hjsdesigns.github.io/demos/mulligans-sumner/">Open</a></figcaption><div class="frame"><iframe src="../mulligans-sumner/index.html?v=re" title="Mulligans Sumner" loading="lazy"></iframe></div><p class="note">NEW hero: neon-strike — back-bar shelf strip, green neon, Edison bulbs strike on in order; mark lands, parks, outline strikes</p></figure><figure class="phone"><figcaption><span class="pname">3. Bean Tree</span><a class="go small" href="https://hjsdesigns.github.io/demos/bean-tree-coffee-puyallup/">Open</a></figcaption><div class="frame"><iframe src="../bean-tree-coffee-puyallup/index.html?v=re" title="Bean Tree" loading="lazy"></iframe></div><p class="note">ORIGINAL hero restored (pre-9/7)</p></figure><figure class="phone"><figcaption><span class="pname">4. Scotty&#x27;s Grub and Pub</span><a class="go small" href="https://hjsdesigns.github.io/demos/scottys-grub-and-pub-puyallup/">Open</a></figcaption><div class="frame"><iframe src="../scottys-grub-and-pub-puyallup/index.html?v=re" title="Scotty&#x27;s Grub and Pub" loading="lazy"></iframe></div><p class="note">NEW hero: money-swing — wall of signed dollar bills, house lights come up, the real oval sign swings down and settles</p></figure><figure class="phone"><figcaption><span class="pname">5. TK Top Nails</span><a class="go small" href="https://hjsdesigns.github.io/demos/tk-top-nails-puyallup/">Open</a></figcaption><div class="frame"><iframe src="../tk-top-nails-puyallup/index.html?v=re" title="TK Top Nails" loading="lazy"></iframe></div><p class="note">NEW hero: polish-station — their polish rack lights band by band, the real banner sign drops in</p></figure><figure class="phone"><figcaption><span class="pname">6. Wayne&#x27;s Inn</span><a class="go small" href="https://hjsdesigns.github.io/demos/waynes-inn-puyallup/">Open</a></figcaption><div class="frame"><iframe src="../waynes-inn-puyallup/index.html?v=re" title="Wayne&#x27;s Inn" loading="lazy"></iframe></div><p class="note">NEW hero: neon-town — their PUYALLUP bar neon strikes on tube by tube over the blurred room; name above in the pole sign&#x27;s two colors</p></figure><figure class="phone"><figcaption><span class="pname">7. Teriyaki Town</span><a class="go small" href="https://hjsdesigns.github.io/demos/teriyaki-town-puyallup/">Open</a></figcaption><div class="frame"><iframe src="../teriyaki-town-puyallup/index.html?v=re" title="Teriyaki Town" loading="lazy"></iframe></div><p class="note">title piece removed — the sign in the photo says it once now</p></figure></div></main><style>.note{font-size:13px;color:var(--mute,#9aa);margin:6px 2px 0}</style>
