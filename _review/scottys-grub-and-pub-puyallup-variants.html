<style>
:root{--bg:#F1F0EA;--card:#FFFFFF;--line:#D8D6CC;--ink:#1B1E1A;--mute:#5F665D;--acc:#2A4D6E;--ok:#1F6B3A;--ok-bg:#E1EFE4;--warn:#9A6A16;--warn-bg:#F5EAD3;--bad:#B3372B;--bad-bg:#F4E1DD;--bezel:#15171A;--disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Source Sans 3','Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181A;--card:#1E2226;--line:#2D3338;--ink:#ECEDE8;--mute:#9BA39C;--acc:#8DB4DA;--ok:#5BBE7C;--ok-bg:#1C3324;--warn:#D9A84A;--warn-bg:#36301F;--bad:#E5776A;--bad-bg:#3A221E;--bezel:#0B0C0E}}
:root[data-theme="dark"]{--bg:#15181A;--card:#1E2226;--line:#2D3338;--ink:#ECEDE8;--mute:#9BA39C;--acc:#8DB4DA;--ok:#5BBE7C;--ok-bg:#1C3324;--warn:#D9A84A;--warn-bg:#36301F;--bad:#E5776A;--bad-bg:#3A221E;--bezel:#0B0C0E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding:16px 12px 60px}
main{max-width:1320px;margin:0 auto}h1{font:700 40px/0.95 var(--disp);text-transform:uppercase;margin:4px 0 4px}.lede{color:var(--mute);font-size:15px;margin:0 0 16px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px 18px;justify-items:center}
.phone{margin:0;width:100%;max-width:400px}
figcaption{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px;padding:0 4px}.name{font:600 21px/1 var(--disp);flex:1 1 auto}
.tag{font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:5px}.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.go{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:7px;border:1px solid var(--line);color:var(--acc);font-weight:700;text-decoration:none;font-size:14px}
.frame{background:var(--bezel);border-radius:44px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.25)}

@media (max-width:420px){body{padding:12px 8px}.frame{padding:8px;border-radius:30px}iframe{border-radius:22px}}
</style><main><h1>Scotty&#x27;s Grub and Pub: hero variants</h1><p class="lede">Eight different openers, each inside a phone. Reload a phone to replay its intro; tap Open to hold it. Say the number you want and it goes live.</p><div class="grid"><figure class="phone"><figcaption><span class="name">1. neon-on-brick</span><a class="go" href="https://hjsdesigns.github.io/demos/scottys-grub-and-pub-puyallup/hero-neon-on-brick.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/scottys-grub-and-pub-puyallup/hero-neon-on-brick.html" title="neon-on-brick" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">Scotty&#x27;s Grub and Pub — hero variant 1: **neon-on-brick** A stationary night still of their own door on North Meridian — the real oval sign lit on the brick, the red *Pull tabs / SCOTTY&#x27;S Grub &amp; Pub / Pool* awning over it, Kokanee and Elysian in the transoms, </p></figure><figure class="phone"><figcaption><span class="name">2. pull-tab</span><a class="go" href="https://hjsdesigns.github.io/demos/scottys-grub-and-pub-puyallup/hero-pull-tab.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/scottys-grub-and-pub-puyallup/hero-pull-tab.html" title="pull-tab" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35"></p></figure><figure class="phone"><figcaption><span class="name">3. since-1933</span><a class="go" href="https://hjsdesigns.github.io/demos/scottys-grub-and-pub-puyallup/hero-since-1933.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/scottys-grub-and-pub-puyallup/hero-since-1933.html" title="since-1933" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">Scotty&#x27;s Grub and Pub — hero variant 4: **since-1933** Typographic, no photograph in the frame: the one line painted on their own oval — **SERVING PUYALLUP SINCE 1933** — set huge in Anton on the room&#x27;s dark ground, wiping up line by line. Then a hairline draw</p></figure><figure class="phone"><figcaption><span class="name">4. specials-board</span><a class="go" href="https://hjsdesigns.github.io/demos/scottys-grub-and-pub-puyallup/hero-specials-board.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/scottys-grub-and-pub-puyallup/hero-specials-board.html" title="specials-board" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35"></p></figure><figure class="phone"><figcaption><span class="name">5. tap-wall</span><a class="go" href="https://hjsdesigns.github.io/demos/scottys-grub-and-pub-puyallup/hero-tap-wall.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/scottys-grub-and-pub-puyallup/hero-tap-wall.html" title="tap-wall" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">Scotty&#x27;s Grub and Pub — hero variant 2: **tap-wall** Their own tap-handle wall runs full bleed and the camera pushes in for thirty seconds — slow enough that you feel it rather than watch it. The frame arrives dark and out of focus, comes up and sharpens once </p></figure><figure class="phone"><figcaption><span class="name">6. walk-in</span><a class="go" href="https://hjsdesigns.github.io/demos/scottys-grub-and-pub-puyallup/hero-walk-in.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/scottys-grub-and-pub-puyallup/hero-walk-in.html" title="walk-in" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">Hero variant 5 — **walk-in** Three of Scotty&#x27;s own interior photographs, exposure- and white-balance-matched and joined by shadowed posts into one continuous strip that drifts sideways the way you actually walk in — past the pull-tab cases and the dollar-bill </p></figure></div></main>
