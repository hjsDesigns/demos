</style><main><h1>Backyard Pizza &amp;amp; Burgers: hero variants</h1><p class="lede">Eight different openers, each inside a phone. Reload a phone to replay its intro; tap Open to hold it. Say the number you want and it goes live.</p><div class="grid"><figure class="phone"><figcaption><span class="name">1. board-type</span><a class="go" href="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-board-type.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-board-type.html" title="board-type" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">board-type — Backyard Pizza &amp; Burgers hero variant Typographic opener, no photographic ground: their real category line — &quot;Indian-Fusion Pizza, Burgers &amp; Wings&quot;, straight off the page title — set huge in the site&#x27;s display face (Fredoka) on the trailer&#x27;s own c</p></figure><figure class="phone"><figcaption><span class="name">2. mural-wall</span><a class="go" href="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-mural-wall.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-mural-wall.html" title="mural-wall" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">mural-wall — Backyard Pizza &amp; Burgers hero variant (2026-09-07) Their own painted trailer wall runs SHARP and full-bleed as the ground (navy leaves, green stalk, red tomatoes on the cream field — `images/mural-wall-ground.jpg`, cropped from `harvest-0906/g6.jp</p></figure><figure class="phone"><figcaption><span class="name">3. neon-strike</span><a class="go" href="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-neon-strike.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-neon-strike.html" title="neon-strike" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">neon-strike The whole hero is their own lit sign, taken apart and switched on in order over the lot-at-night navy: the arched **BACKYARD** wordmark strikes first, then the **skateboarding burger + pizza slice**, then the **&quot;Pizza &amp; Burgers&quot;** script — each wit</p></figure><figure class="phone"><figcaption><span class="name">4. oven-glow</span><a class="go" href="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-oven-glow.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-oven-glow.html" title="oven-glow" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">oven-glow — hero variant 2 Their own meat pizza photo (`images/size-pizza.jpg`, upscaled and lightly graded into `images/oven-glow-pie.jpg` — never redrawn) runs full-bleed, settling out of a dark warm frame while one slow amber pulse rises through the middle </p></figure><figure class="phone"><figcaption><span class="name">5. skate-in</span><a class="go" href="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-skate-in.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-skate-in.html" title="skate-in" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">skate-in The BACKYARD arc drops in first, then their two real mascots — the neon skateboarding burger and the neon skateboarding pizza slice — roll in from opposite sides, settle with one small wheel-rock under the wordmark, and stop dead; after that only a ve</p></figure><figure class="phone"><figcaption><span class="name">6. slice-turn</span><a class="go" href="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-slice-turn.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-slice-turn.html" title="slice-turn" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">slice-turn Their own top-down pie fills the hero and turns one quarter turn, like a peel setting it down, while their real lit sign fades up on a cream plate over it — then everything stops dead and holds still. One move, no loop, no interaction. Real assets: </p></figure><figure class="phone"><figcaption><span class="name">7. stand-still</span><a class="go" href="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-stand-still.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-stand-still.html" title="stand-still" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">stand-still The real painted trailer in full daylight (harvest `g26.jpg` — blue sky, string lights, the mural, the service window) held perfectly still: no ken-burns, no drift, no loop. One warm bloom drifts across the frame on load, the trailer&#x27;s own BACKYARD</p></figure><figure class="phone"><figcaption><span class="name">8. ticket-rail</span><a class="go" href="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-ticket-rail.html">Open</a></figcaption><div class="frame"><iframe src="https://hjsdesigns.github.io/demos/backyard-pizza-puyallup/hero-ticket-rail.html" title="ticket-rail" loading="lazy"></iframe></div><p class="note" style="font-size:13px;color:var(--mute);margin:8px 4px 0;line-height:1.35">ticket-rail (variant 8) — Backyard Pizza &amp; Burgers Their real lit sign (`images/claude-sign.jpg`) holds the top over their own painted mural blurred and warm (`images/claude-hero-blur.jpg`), and three real dish photos slide onto a kitchen ticket rail underneat</p></figure></div></main>
