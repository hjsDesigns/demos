<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Thursday batch — chosen heroes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#15181A;--card:#1F2528;--ink:#EEE8DA;--mute:#9B978B;--line:#30383C;--brand:#E26A3E;--ok:#56B98A;--warn:#E0A939;--disp:'Bricolage Grotesque','Avenir Next',Helvetica,sans-serif;--body:'Nunito','Avenir Next',Helvetica,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
body{padding:18px 16px 60px;max-width:720px;margin:0 auto}
h1{font:700 30px/1.05 var(--disp);margin:0 0 4px}.stamp{color:var(--mute);font-size:14px;margin:0 0 18px}
h2{font:700 13px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin:22px 0 10px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--ink);font:inherit;cursor:pointer;display:grid;gap:3px;transition:transform .12s,border-color .12s}
.item:hover,.item:focus-visible{border-color:var(--brand);transform:translateY(-1px);outline:none}
.item b{font:700 18px/1.2 var(--disp)}.item .town{color:var(--mute);font-size:13px;margin-left:8px}.item p{margin:0;color:var(--mute);font-size:13.5px}
.item .tap{color:var(--brand);font-weight:700;font-size:13px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor;margin-left:8px;vertical-align:middle}
.ok{color:var(--ok)}.warn{color:var(--warn)}
#view{position:fixed;inset:0;background:rgba(10,12,13,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:9}
#view.on{display:flex}
.phone{position:relative;width:390px;height:844px;background:#000;border-radius:44px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px #2a2f33;transform:scale(var(--s,1));transform-origin:center}
.phone iframe{width:100%;height:100%;border:0;border-radius:34px;background:#fff;display:block}
.x{position:absolute;top:-6px;left:-6px;width:44px;height:44px;border-radius:50%;border:0;background:var(--brand);color:#fff;font:700 22px/44px var(--body);text-align:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.replay{position:absolute;top:-6px;right:-6px;width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--ink);font:700 18px/44px var(--body);text-align:center;cursor:pointer;border:1px solid var(--line)}
.name{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);color:var(--mute);font-size:13px;white-space:nowrap}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;line-height:40px;text-align:center;cursor:pointer}
.nav.prev{left:-54px}.nav.next{right:-54px}@media (max-width:520px){.nav{display:none}}
</style>
</head>
<body>
<h1>Thursday batch · chosen heroes</h1>
<p class="stamp">Each site opens with the hero you picked in Codex · tap one, it opens as your phone · ← → flips · ↻ replays the opening · X closes</p>
<div id="groups"></div>

<div id="view" role="dialog" aria-modal="true">
  <div class="phone" id="phone">
    <button class="x" id="close" aria-label="Close">×</button>
    <button class="replay" id="replay" aria-label="Replay">↻</button>
    <button class="nav prev" id="prev" aria-label="Previous">‹</button>
    <iframe id="frame" title="site preview" src="about:blank"></iframe>
    <button class="nav next" id="next" aria-label="Next">›</button>
    <div class="name" id="name"></div>
  </div>
</div>

<script>
const G=[
 ["Chosen · 6",[
  ["El Caporal","Maple Valley","../el-caporal-maple-valley/versions/hero-your-usual-table.html","Your Usual Table — the lantern-lit room beside a tall cream invitation","ok","chosen"],
  ["Homestead Brew","Sumner","../homestead-brew-sumner/versions/hero-cabin-postcard.html","The Cabin Postcard — the cedar stand as a framed keepsake beside oversized type","ok","chosen"],
  ["Kelly Latte's","Kent","../kelly-lattes-kent/versions/hero-extra-good-cream-and-coffee.html","Extra Good · Cream & Coffee — warm cream, coffee-brown type, the approved latte photo","ok","chosen"],
  ["Village Coffee","Maple Valley","../village-coffee-maple-valley/versions/hero-magnolia-morning.html","Magnolia Morning — the magnolia canopy is the invitation, cream nameplate beside it","ok","chosen"],
  ["Euphoriq Skin & Beauty","Sumner","../euphoriq-skin-and-beauty-sumner/versions/hero-the-living-wall.html","The Living Wall — her real neon inside an edge-to-edge wall of leaves","ok","chosen"],
  ["GLO Skin Clinic and Spa","Maple Valley","../glo-skin-clinic-maple-valley/versions/hero-entirely-yours.html","Entirely Yours — a quiet editorial sentence wrapped around the real room","ok","chosen"]]],
 ["Chosen, Codex still refining · 1",[
  ["Salon 410","Buckley","../salon-410-buckley/versions/hero-color-studio.html","The Color Studio — your pick; a more sophisticated background is being prepared","warn","refining"]]],
 ["Still to choose · 2",[
  ["Zola's Cafe — favorite 1","Auburn","../zolas-cafe-auburn/versions/hero-morning-on-main.html","Morning on Main — handwritten masthead, sculptural oval of real coffee","warn","open"],
  ["Zola's Cafe — favorite 3","Auburn","../zolas-cafe-auburn/versions/hero-stay-a-little-longer.html","Stay a Little Longer — panoramic cafe journal, monumental plum type","warn","open"],
  ["Roundup — combined option 3","Graham","../roundup-bar-grill-graham/versions/hero-where-the-night-begins.html","Where the Night Begins — the cinematic room of option 1 with the maroon roadside character of option 2","warn","your verdict"]]]
];
const ALL=G.flatMap(g=>g[1]);
const view=document.getElementById('view'),frame=document.getElementById('frame'),nameEl=document.getElementById('name'),phone=document.getElementById('phone');
let cur=-1;const root=document.getElementById('groups');
G.forEach(([title,items])=>{const h=document.createElement('h2');h.textContent=title;root.appendChild(h);const ul=document.createElement('ul');items.forEach(it=>{const i=ALL.indexOf(it);const li=document.createElement('li');li.innerHTML=`<button class="item" data-i="${i}"><span><b>${it[0]}</b><span class="town">${it[1]}</span><span class="pill ${it[4]}">${it[5]}</span></span><p>${it[3]}</p><span class="tap">Open on the phone →</span></button>`;ul.appendChild(li);});root.appendChild(ul);});
function fit(){const s=Math.min(1,(innerHeight-36)/844,(innerWidth-24)/390);phone.style.setProperty('--s',s.toFixed(3));}
function open(i){cur=(i+ALL.length)%ALL.length;const it=ALL[cur];frame.src=it[2]+'?v='+Date.now();nameEl.textContent=it[0]+' · '+(cur+1)+' of '+ALL.length;view.classList.add('on');fit();document.body.style.overflow='hidden';}
function close(){view.classList.remove('on');frame.src='about:blank';document.body.style.overflow='';}
root.addEventListener('click',e=>{const b=e.target.closest('.item');if(b)open(+b.dataset.i);});
document.getElementById('close').onclick=close;document.getElementById('replay').onclick=()=>open(cur);
document.getElementById('prev').onclick=()=>open(cur-1);document.getElementById('next').onclick=()=>open(cur+1);
view.addEventListener('click',e=>{if(e.target===view)close();});
addEventListener('keydown',e=>{if(!view.classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')open(cur+1);if(e.key==='ArrowLeft')open(cur-1);if(e.key==='r')open(cur);});
addEventListener('resize',fit);
</script>
</body>
</html>
