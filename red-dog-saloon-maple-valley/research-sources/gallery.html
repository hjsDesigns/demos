<style>
    * {
        margin: 0;
        padding: 0;
    }

    html,
    body {
        position: relative;
        height: 100%;
        background-color: #000;

    }



    .swiper-container {
        width: 100%;
        height: 100%;
    }

    .main-slider-header {
        color: #fff;
        z-index: 12;
        position: relative;
        background: #000;
    }

    .photo-credit {
        position: absolute;
        bottom: 0;
        z-index: 9999;
        color: white;
        padding: 4px 8px;
        background: #000;
        width: 100%;
    }

    .sliders {
        height: 99vh;
        /* Use vh as a fallback for browsers that do not support Custom Properties */
        height: calc(var(--vh, 1vh) * 99);
        margin: 0;
        display: flex;
        overflow: hidden;
        padding-bottom: env(safe-area-inset-bottom);
    }

    /* Стили для вертикального слайдера с превью */
    .preview-slider {
        width: 225px;
        float: left;
        z-index: 999;
        background: #000;
        /* Весь экран по высоте */
    }

    .preview-slider img {
        width: 225px;
        height: 225px;
        object-fit: cover;
    }

    .preview-slider .swiper-slide {
        text-align: center;
        font-size: 18px;
        height: auto;

    }

    /* Стили для основного слайдера с фотографиями */
    .main-slider {
        background-color: #000;
        position: relative;
        flex-grow: 1;
        /* Занимает оставшееся пространство */
        height: 99vh;
        /* Use vh as a fallback for browsers that do not support Custom Properties */
        height: calc(var(--vh, 1vh) * 99);

        /* Весь экран по высоте */
        max-width: calc(100% - 225px);
    }

    .main-slider .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
    }



    /* swiper btn */
    .swiper-button-prev,
    .swiper-button-next {
        color: #51ab6d;
    }

    .swiper-pagination {
        display: none;
    }

    .main-slider .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        background-color: #000;
        object-fit: contain;
    }

    @media screen and (max-width: 767.98px) {
        .main-slider .swiper-slide {
            height: 85vh;
            /* Use vh as a fallback for browsers that do not support Custom Properties */
            height: calc(var(--vh, 1vh) * 85);

            background-color: #000;
        }

        .photo-credit {
            bottom: 40px;
            left: 0px;
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
            background: #000;
            width: auto;
        }

        .swiper-pagination {
            display: block;
            z-index: 9999;
        }

        .swiper-pagination span {
            background-color: #51ab6d;
        }

        .swiper-button-prev,
        .swiper-button-next {
            display: none;
        }

        .sliders {
            flex-direction: column;
            height: 99vh;
            /* Use vh as a fallback for browsers that do not support Custom Properties */
            height: calc(var(--vh, 1vh) * 99);

        }

        .main-slider {
            max-width: 100%;
            height: 85vh;
            /* Use vh as a fallback for browsers that do not support Custom Properties */
            height: calc(var(--vh, 1vh) * 85);

            /* height: 50vh; */
        }

        .preview-slider {
            display: none;
        }

        .main-slider img {
            width: 100%;
            height: auto;
        }

    }
    .swiper-wrapper{
        height: 93%;
    }


</style>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    // First we get the viewport height and we multiple it by 1% to get a value for a vh unit
    let vh = window.innerHeight * 0.01;
    // Then we set the value in the --vh custom property to the root of the document
    document.documentElement.style.setProperty('--vh', `${vh}px`);

    // We listen to the resize event
    window.addEventListener('resize', () => {
        // We execute the same script as before
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
    });

    const getInitSlide = () => {
        // const urlParams = new URLSearchParams(window.location.search);
        // const slideName = urlParams.get('id'); // 'id' params from url
        const hash = window.location.hash;
        const slideName = hash.startsWith('#id=') ? hash.substring(4) : null;

        let initialSlideIndex = 0; // default index 
        if (slideName) {
            const allSlides = document.querySelectorAll('.swiper-slide[data-name]');
            allSlides.forEach((slide, index) => {
                if (slide.getAttribute('data-name') == slideName) {
                    initialSlideIndex = index;
                }
            });
        }

        return initialSlideIndex ?? 0;
    }

    function updateCounterAndCredit(slider) {
        // Update counter
        let currentSlide = slider.realIndex + 1;
        let totalSlides = slider.slides.length;
        document.querySelector('.slider-counter').textContent = `${currentSlide} / ${totalSlides}`;

        // Update author name
        // Note that for this, each slide in the HTML must have a data attribute with the author's name, for example: <div class="swiper-slide" data-credit="Author Name">
        let currentCredit = slider.slides[slider.realIndex].querySelector('img').getAttribute('data-credit');
        document.getElementById('photo-credit-name').textContent = currentCredit || 'Неизвестен';
    }
    // Initializing the vertical slider with previews
    const previewSlider = new Swiper('.preview-slider', {
        direction: 'vertical',
        slidesPerView: 'auto',
        freeMode: true,
        watchSlidesVisibility: true,
        watchSlidesProgress: true,
        mousewheel: true,
        lazy: {
            loadPrevNext: true, // Загружать предыдущее и следующее изображения
            loadPrevNextAmount: 1, // Количество слайдов для предзагрузки до и после текущего
            loadOnTransitionStart: true // Начать загрузку при смене слайда
        },

        scrollbar: {
            el: '.swiper-scrollbar',
            hide: true,
        },
        spaceBetween: 8,
    });

    // Initializing the main photo slider
    const mainSlider = new Swiper('.main-slider', {
        spaceBetween: 10,
        slidesPerView: 1,
        loop: true,
        centeredSlides: true,
        spaceBetween: 30,
        navigation: false,
        keyboard: true,
        initialSlide: getInitSlide(),
        lazy: {
            loadPrevNext: true, // Загружать предыдущее и следующее изображения
            loadPrevNextAmount: 1, // Количество слайдов для предзагрузки до и после текущего
            loadOnTransitionStart: true // Начать загрузку при смене слайда
        },

        pagination: {
            el: '.swiper-pagination',
            type: 'bullets',
            clickable: true,
            dynamicBullets: true,
            dynamicMainBullets: 5
        },
        navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
        },
        thumbs: {
            swiper: previewSlider,
        },
        // Update slide counter and photo author
        on: {
            init: function() {
                updateCounterAndCredit(this);
            },
            slideChange: function() {
                updateCounterAndCredit(this);
            },
        },
    });
</script>
