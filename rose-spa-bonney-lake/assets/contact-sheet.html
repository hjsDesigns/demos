<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Contact sheet</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;padding:24px;background:#EFE7D8;color:#18211C;font:15px/1.4 -apple-system,Helvetica,Arial,sans-serif}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 20px;color:#66635A}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
figure{margin:0;background:#F6EFE2;border:1px solid #DCD2BF;padding:10px;border-radius:10px}
figure img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:6px;background:#E5DBC7}
figcaption{margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
figcaption b{display:inline-block;min-width:28px;color:#B8241F;font-size:15px}
.dim{color:#66635A;font-size:11px}
</style></head><body>
<h1>Contact sheet</h1>
<p>7 images in images/ — say the number + the slot (“7 for hero, 3 and 12 for gallery”).</p><div class="grid">
<figure><img src="../images/room-desk.jpg" alt="room-desk.jpg" loading="lazy"><figcaption><b>1</b> room-desk.jpg <span class="dim">1440×1080</span></figcaption></figure>
<figure><img src="../images/room-hallway.jpg" alt="room-hallway.jpg" loading="lazy"><figcaption><b>2</b> room-hallway.jpg <span class="dim">1440×1080</span></figcaption></figure>
<figure><img src="../images/room-sofa.jpg" alt="room-sofa.jpg" loading="lazy"><figcaption><b>3</b> room-sofa.jpg <span class="dim">2500×1875</span></figcaption></figure>
<figure><img src="../images/room-treatment.jpg" alt="room-treatment.jpg" loading="lazy"><figcaption><b>4</b> room-treatment.jpg <span class="dim">1440×1080</span></figcaption></figure>
<figure><img src="../images/room-waiting.jpg" alt="room-waiting.jpg" loading="lazy"><figcaption><b>5</b> room-waiting.jpg <span class="dim">1440×1080</span></figcaption></figure>
<figure><img src="../images/storefront.jpg" alt="storefront.jpg" loading="lazy"><figcaption><b>6</b> storefront.jpg <span class="dim">1920×1080</span></figcaption></figure>
<figure><img src="../images/logo.png" alt="logo.png" loading="lazy"><figcaption><b>7</b> logo.png <span class="dim">900×318</span></figcaption></figure>
</div></body></html>
