<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>6 · Pick your metal</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow:wght@400;500;600&family=Archivo:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0C0E;--bg2:#101317;--ink:#E9ECEF;--mute:#9AA3AD;--line:rgba(255,255,255,.09);--spark:#24B7CA;--spark2:#7FE3F2;--deep:#0F7D8C;--open:#10B981;--closed:#EF4444;
--display:'Russo One','Arial Black',Impact,sans-serif;--body:'Barlow','Helvetica Neue',Arial,sans-serif;--panel-body:'Archivo','Barlow',sans-serif;--pad:clamp(18px,4vw,56px);--maxw:1560px;--frame:6px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
.ctx{height:110px;background:url(../../images/hero/pick-golden-desk.jpg) center 100%/cover no-repeat;position:relative}.ctx::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,12,14,0),rgba(10,12,14,.2) 60%,var(--bg))}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.eyebrow{margin:0 0 10px;font:600 12px/1 var(--body);letter-spacing:.26em;text-transform:uppercase;color:var(--spark)}
h2{margin:0 0 14px;font:400 clamp(30px,4vw,54px)/1.02 var(--display);letter-spacing:.01em;text-transform:uppercase;color:#fff}
.plate{background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18)),url(../../images/texture/panel-steel.jpg) center/cover no-repeat;box-shadow:inset var(--frame) 0 0 #000,inset 0 0 0 1px rgba(0,0,0,.35),inset 0 0 120px rgba(0,0,0,.25)}
.plate .eyebrow{color:#0F7D8C}.plate .hours span{color:#1b2026}.plate .hours b{color:#0b0e12}.plate .hours li{background:rgba(255,255,255,.35);border-color:rgba(0,0,0,.25)}.plate .hours li.today{background:rgba(36,183,202,.25)}.plate .where{color:#0b0e12;text-shadow:none}.plate .where small{color:#1b2026}
.plate h2,.plate p,.plate li{color:#111;text-shadow:none;-webkit-text-stroke:1.2px rgba(255,255,255,.55);paint-order:stroke fill}.plate p{font:700 22px/1.9 var(--panel-body)}
.dark{background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.52)),url(../refs/his-steel/shop-2.jpg) center/cover no-repeat;box-shadow:inset var(--frame) 0 0 #000,inset 0 0 0 1px rgba(255,255,255,.06)}
.frame{border:var(--frame) solid #000;background:#000;box-shadow:0 18px 50px -24px rgba(0,0,0,.9);position:relative}.frame img{display:block;width:100%;height:100%;object-fit:cover}
.frame figcaption,.frame .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0));font:600 13px/1.3 var(--body);letter-spacing:.04em;color:#fff}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border-radius:4px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:var(--ink);font:600 14px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.btn.primary{background:var(--spark);border-color:var(--spark);color:#041014}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--open);box-shadow:0 0 0 4px rgba(16,185,129,.18),0 0 18px rgba(16,185,129,.6);vertical-align:middle;margin-right:10px}
.tag{position:fixed;left:12px;top:12px;z-index:9;font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:rgba(233,236,239,.7);background:rgba(10,12,14,.6);padding:8px 10px;border-radius:4px}

.gad{padding:clamp(40px,6vw,90px) var(--pad)}.gad-in{max-width:var(--maxw);margin:0 auto}.hint{margin:0 0 18px;color:var(--mute);font:500 15px var(--body)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.tile{all:unset;cursor:pointer;display:block}.tile .frame{display:block;aspect-ratio:4/3;transition:transform .2s,box-shadow .2s}.tile.lit .frame{border-color:var(--spark);box-shadow:0 0 0 1px var(--spark),0 0 34px rgba(36,183,202,.45);transform:translateY(-3px)}
.readout{font:400 clamp(22px,2.4vw,34px)/1.1 var(--display);text-transform:uppercase;color:#fff;margin:0 0 16px}.readout b{color:var(--spark2);font-weight:400}
@media(max-width:700px){.tiles{grid-template-columns:1fr}}
</style></head><body><div class="tag">6 · Gadget · Pick your metal</div><section class="gad" id="metal" aria-label="Pick your metal"><div class="gad-in"><p class="eyebrow">Pick your metal</p><h2>Steel, aluminum or Corten</h2><p class="hint">Tap one. A real job in that metal lights up, and the text fills itself.</p><div class="tiles"><button class="tile" data-job="a steel job" data-name="Track bars · Duramax"><span class="frame"><img src="../../images/work/track-bars-duramax.jpg" alt=""><span class="cap">Steel</span></span></button><button class="tile" data-job="an aluminum job" data-name="Roof-rack bars"><span class="frame"><img src="../../images/work/aluminum-roof-rack-bars.jpg" alt=""><span class="cap">Aluminum</span></span></button><button class="tile lit" data-job="a Corten job" data-name="Fire pit · Snohomish"><span class="frame"><img src="../../images/work/corten-fire-pit-snohomish.jpg" alt=""><span class="cap">Corten</span></span></button></div><p class="readout"><b>Corten</b> · Fire pit · Snohomish</p><a class="btn primary" id="go" href="sms:+14252836496&body=Hey%20Trustin%2C%20I%27ve%20got%20a%20Corten%20job.">Text Trustin: a Corten job</a></div></section>
<script>document.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tile').forEach(x=>x.classList.remove('lit'));t.classList.add('lit');const j=t.dataset.job;document.querySelector('.readout').innerHTML='<b>'+t.querySelector('.cap').textContent+'</b> · '+t.dataset.name;const g=document.getElementById('go');g.textContent='Text Trustin: '+j;g.href='sms:+14252836496&body='+encodeURIComponent("Hey Trustin, I've got "+j+".");}));</script></body></html>
